---
- name: Build e push delle immagini
  containers.podman.podman_image:
    name: "{{ images_registry }}/{{ item.name }}"
    tag: "{{ images_tag }}"
    path: "{{ images_workdir }}"
    state: build
    push: true
    build:
      file: "{{ images_workdir }}/{{ item.containerfile }}"
      format: docker
      extra_args: "--build-arg SSH_USER={{ images_ssh_user }}"
  loop: "{{ images_list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Avvia i container
  containers.podman.podman_container:
    name: "{{ item.name }}"
    image: "{{ images_registry }}/{{ item.name }}:{{ images_tag }}"
    state: started
    restart_policy: always
    ports:
      - "127.0.0.1:{{ images_base_port | int + idx + 1 }}:22"
  loop: "{{ images_list }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"
