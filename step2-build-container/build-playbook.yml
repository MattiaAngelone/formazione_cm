---
- name: Build di container ssh-ready su OS differenti
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ssh_user: devops
    build_dir: "{{ playbook_dir }}"
    key_file: "{{ playbook_dir }}/keys/id_{{ ssh_user }}"
    images:
      - name: ssh-ubuntu
        containerfile: Containerfile.ubuntu
        host_port: 2201
      - name: ssh-rocky
        containerfile: Containerfile.rocky
        host_port: 2202

  tasks:
    - name: Crea la directory delle chiavi
      ansible.builtin.file:
        path: "{{ playbook_dir }}/keys"
        state: directory
        mode: "0700"

    - name: Genera la coppia di chiavi SSH
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -t ed25519 -N ''
          -C "{{ ssh_user }}@formazione-cm"
          -f {{ key_file }}
        creates: "{{ key_file }}"

    - name: Porta la chiave pubblica nel contesto di build
      ansible.builtin.copy:
        src: "{{ key_file }}.pub"
        dest: "{{ build_dir }}/authorized_keys"
        mode: "0644"

    - name: Genera la configurazione sshd
      ansible.builtin.template:
        src: sshd_hardening.conf.j2
        dest: "{{ build_dir }}/sshd_hardening.conf"
        mode: "0644"

    - name: Build dellle immagini
      containers.podman.podman_image:
        name: "{{ item.name }}"
        tag: latest
        path: "{{ build_dir }}"
        state: build
        force: "{{ rebuild | default(false) | bool }}"
        build:
          file: "{{ build_dir }}/{{ item.containerfile }}"
          format: docker
          extra_args: "--build-arg SSH_USER={{ ssh_user }}"
      loop: "{{ images }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Avvia i container
      containers.podman.podman_container:
        name: "{{ item.name }}"
        image: "{{ item.name }}:latest"
        state: started
        restart_policy: always
        ports:
          - "{{ item.host_port }}:22"
      loop: "{{images }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Comandi di accesso
      ansible.builtin.debug:
        msg: "ssh -i {{ key_file }} -p {{ item.host_port }} {{ ssh_user }}@localhost"
      loop: "{{ images }}"
      loop_control:
        label: "{{ item.name }}"
